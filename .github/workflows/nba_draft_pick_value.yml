name: Simulate NBA Draft Pick Value

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'

jobs:
  simulate_NBA_draft_pick_value:
    name: Simulate NBA Draft Pick Value
    runs-on: ubuntu-latest
    # env:
    #   GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3  
      
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.x'
      #     cache-dependency-path: false  # Skip caching
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r NBA_draft_pick_value_model/requirements_draft_value.txt
          
      - name: Run Python update script
        env:
          DNT_API_KEY: ${{ secrets.DNT_API_KEY }} 
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }} 
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }} 
        run: python NBA_draft_pick_value_model_sim.py
        shell: bash

